[package]
name = "phobos-ledger-store"
edition = "2024"
version.workspace = true
license.workspace = true

[lib]
doctest = false
name = "phobos_ledger_store"
path = "src/lib.rs"

[dependencies]
phobos-file-storage = { path = "../phobos-file-storage" }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true

phobos-ledger = { path = "../phobos-ledger" }
phobos-descriptors = { path = "../phobos-descriptors" }

[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3.23.0"
