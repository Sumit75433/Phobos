doctest = false

[dependencies]
phobos-descriptors = { path = "../phobos-descriptors" }
phobos-interfaces = { path = "../phobos-interfaces" }
phobos-ledger = { path = "../phobos-ledger" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
