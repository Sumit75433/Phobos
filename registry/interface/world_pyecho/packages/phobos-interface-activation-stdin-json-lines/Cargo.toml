[package]
name = "phobos-interface-activation-stdin-json-lines"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "phobos_interface_activation_stdin_json_lines"
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "io-std", "io-util"] }
tracing = "0.1.44"
phobos-descriptors = { path = "../../../../../crates/phobos-descriptors" }
phobos-interfaces = { path = "../../../../../crates/phobos-interfaces" }
phobos-interface-transport = { path = "../../../../../crates/phobos-interface-transport" }
phobos-world-pyecho-life-runtime = { path = "../phobos-world-pyecho-life-runtime" }
