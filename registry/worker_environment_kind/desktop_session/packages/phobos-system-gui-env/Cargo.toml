[package]
name = "phobos-system-gui-env"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "phobos_system_gui_env"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", features = ["json"] }
url = "2"
blake3.workspace = true

phobos-descriptors = { path = "../../../../../crates/phobos-descriptors" }
phobos-tool-door-runtime = { package = "phobos-process-session-tool-runtime", path = "../../../process_session/packages/phobos-process-session-tool-runtime" }
phobos-interfaces = { path = "../../../../../crates/phobos-interfaces" }
phobos-app-server-interface = { path = "../../../../interface/world_operator_chat/packages/phobos-app-server-interface" }
phobos-tool-handlers = { path = "../../../../../crates/phobos-tool-handlers" }
phobos-tool-registry = { path = "../../../../../crates/phobos-tool-registry" }
phobos-worker-env = { path = "../../../../../crates/phobos-worker-env" }


[dev-dependencies]
phobos-ledger = { path = "../../../../../crates/phobos-ledger" }
tempfile = "3"
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread"] }
