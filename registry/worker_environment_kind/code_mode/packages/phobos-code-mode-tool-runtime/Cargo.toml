[package]
name = "phobos-code-mode-tool-runtime"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[[bin]]
name = "phobos-code-mode-tool-door-life"
path = "src/bin/tool_door_life.rs"

[dependencies]
phobos-code-mode-room = { path = "../phobos-code-mode-room" }
tokio = { workspace = true, features = ["rt", "sync", "io-std", "io-util", "time", "process"] }
phobos-descriptors = { path = "../../../../../crates/phobos-descriptors" }
phobos-tool-door-runtime = { package = "phobos-process-session-tool-runtime", path = "../../../process_session/packages/phobos-process-session-tool-runtime" }

phobos-run-authoring = { path = "../../../../interface/system_interface_authoring/packages/phobos-run-authoring" }
phobos-interfaces = { path = "../../../../../crates/phobos-interfaces" }
phobos-ledger = { path = "../../../../../crates/phobos-ledger" }
phobos-run-record = { path = "../../../../../crates/phobos-run-record" }
phobos-tool-handlers = { path = "../../../../../crates/phobos-tool-handlers" }
phobos-worker-env = { path = "../../../../../crates/phobos-worker-env" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
