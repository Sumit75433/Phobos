[package]
name = "phobos-workspace-substrate"
edition = "2024"
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "phobos_workspace_substrate"
path = "src/lib.rs"
doctest = false

[dependencies]
phobos-descriptors = { path = "../../../../../crates/phobos-descriptors" }
phobos-worker-env = { path = "../../../../../crates/phobos-worker-env" }
phobos-applypatch = { path = "../phobos-applypatch" }
phobos-exec = { package = "phobos-exec-substrate", path = "../../../process_session/packages/phobos-exec-substrate" }
phobos-file-system = { path = "../../../process_session/packages/phobos-file-system" }
phobos-sandbox-base = { package = "phobos-sandbox-substrate", path = "../../../process_session/packages/phobos-sandbox-substrate" }
phobos-util-pathuri = { path = "../../../process_session/packages/phobos-util-pathuri" }
phobos-util-pty = { path = "../../../process_session/packages/phobos-util-pty" }
base64 = "0.22.1"
blake3.workspace = true
fs2 = "0.4"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[target.'cfg(target_os = "linux")'.dependencies]
phobos-verifiers = { path = "../../../../../crates/phobos-verifiers" }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { workspace = true, features = ["macros", "rt"] }
